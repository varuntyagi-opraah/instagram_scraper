[project]
name = "opraah-scraper"
version = "0.1.0"
description = "Opraah roster Instagram collector and creator knowledge base (Meta Business Discovery + logged-out public pages)"
requires-python = ">=3.11"
dependencies = [
    "instaloader==4.16",
    "requests>=2.32,<3",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
opraah-scraper = "opraah_scraper.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["opraah_scraper*"]

[tool.setuptools.package-data]
opraah_scraper = ["schema.sql", "schema_v2.sql", "default_topics.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
